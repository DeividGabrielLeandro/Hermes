<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat · HERMES</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/chat.css" />
  </head>
  <body>
    <div class="Principal">
      <div class="Conversas">
        <h1 id="identidade_hermes">Hermes</h1>
        <button id="ocultarBarraLateral" type="button">Ocultar</button>
        <button id="novaConversa" class="btn btn-dourado" type="button">+ Nova conversa</button>
        <input
          id="buscarConversas"
          name="busca"
          type="search"
          aria-label="Buscar conversas"
          placeholder="Buscar conversas"
          autocomplete="off"
        />
        <ul id="historico"></ul>
        <div class="informacoesExtra">
          <button type="button" id="botaoChave">
            <span>Chave de API</span>
            <span id="status"></span>
          </button>

          <div class="perfil">
            <span class="avatar">M</span>
            <h3 id="nomeUsuario">Seu nome</h3>
            <button id="sair" type="button">Sair</button>
          </div>
        </div>
      </div>
      <div class="ChatBot">
        <header>
          <h2 id="tituloConversa"></h2>

          <div class="topo-acoes">
            <p id="provedorApi">Gemini 2.5 Flash</p>
            <button id="tema_pagina" type="button" class="btn-tema">Tema</button>
          </div>
        </header>
        <section id="mensagens"></section>
        <div class="enviarMensagem">
          <textarea name="digitarMensagem" id="mensagem" placeholder="Escreva uma mensagem para o Hermes..."></textarea>
          <button type="button" id="enviar" aria-label="Enviar"></button>
        </div>
        <p class="aviso">O Hermes pode errar. Confira as informações importantes.</p>
      </div>
      <dialog id="janelaChave">
        <h2>Sua chave de API</h2>
        <p>
          Sua chave de API é criptografada e guardada no servidor do Hermes. Ela só é usada para enviar as suas
          mensagens ao Gemini.
        </p>
        <p>
          Chave atual:
          <span id="finalChave"></span>
        </p>
        <label for="novaChave">Nova chave</label>
        <input
          id="novaChave"
          name="chave-api"
          type="password"
          autocomplete="new-password"
          spellcheck="false"
          data-lpignore="true"
          data-1p-ignore
        />
        <button type="button" id="cancelarChave">Cancelar</button>
        <button type="button" id="salvarChave">Salvar chave</button>
      </dialog>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/chat.js"></script>
  </body>
</html>
