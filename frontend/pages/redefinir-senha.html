<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha · HERMES</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="auth">
      <div class="painel-esquerdo">
        <header>
          <a href="../index.html" id="identidade_hermes">HERMES</a>

          <div class="topo-acoes">
            <button id="tema_pagina" class="btn-tema">Tema</button>
          </div>
        </header>

        <main class="auth-conteudo">
          <p class="sobretitulo">Nova senha</p>
          <h1>Crie uma senha nova</h1>
          <p>
            Escolha a senha nova da sua conta. Depois é só entrar com ela.
          </p>
          <form class="cadastro" id="cadastro">
            <div class="campo">
                <label for="senha">Senha</label>
                <input minlength="8" id="senha" type="password" placeholder="" required>
                <span class="campo-dica">Mínimo de 8 caracteres.</span>
            </div>

            <div class="campo">
                <label for="confirmar-senha">Confirmar senha</label>
                <input minlength="8" id="confirmar-senha" type="password" placeholder="" required>
                <p id="form-erro" class="form-erro"></p>
            </div>
            
            <button type="submit" class="btn btn-dourado">Salvar nova senha</button>
          </form>

          <p class="auth-alternativa">
            <a href="login.html">Voltar para o login</a>
          </p>
        </main>
      </div>

      <div class="painel-direito">
        <img src="../images/hermes-dourado.jpg" alt="Busto de mármore de Hermes, da estátua de Praxíteles" />
        <div class="painel-sombra"></div>

        <div class="painel-legenda">
          <p class="sobretitulo">ΕΡΜΗΣ</p>
          <h2>Toda mensagem precisa de um mensageiro.</h2>
        </div>
      </div>
    </div>
    <script src="../js/script.js"></script>
    <script src="../js/redefinir-senha.js"></script>
  </body>
</html>
